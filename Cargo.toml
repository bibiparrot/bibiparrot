[package]
name = "bibiparrot-egui"
version = "0.2.0"
edition = "2021"
description = "Native Rust/egui foreign-language listening and dictation workspace"
build = "build.rs"

[[bin]]
name = "bibiparrot"
path = "src/main.rs"

[[bin]]
name = "package-release"
path = "tools/package-release.rs"

[[bin]]
name = "screenshot-fixture"
path = "tools/screenshot-fixture.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_dock = "0.17.0"
egui_extras = { version = "0.32.3", features = ["svg"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pictogram = { version = "0.3.0", default-features = false, features = ["font-awesome"] }
rfd = "0.15"
rust-i18n = "4.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
release-check = { path = "tools/release-check" }
sys-locale = "0.3.2"
toml = "0.8"
whisper-rs = "0.16.0"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = "0.32.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
