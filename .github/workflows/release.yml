name: Build and publish desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-14
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GGML_NATIVE: 'OFF'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libgtk-3-dev libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev ffmpeg rpm ruby ruby-dev build-essential patchelf
          sudo gem install fpm --no-document
      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Install Windows media dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath thirdparty
          $ffmpegRoot = (Get-ChildItem thirdparty -Directory -Filter 'ffmpeg-*' | Select-Object -First 1).FullName
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "$ffmpegRoot\bin" >> $env:GITHUB_PATH
      - name: Download bundled offline speech models
        shell: bash
        run: |
          mkdir -p thirdparty/models/whisper thirdparty/models/whisper-vad
          curl -fL --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin' -o thirdparty/models/whisper/ggml-base.bin
          curl -fL --retry 3 'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin' -o thirdparty/models/whisper-vad/ggml-silero-v6.2.0.bin
      - name: Test
        run: cargo test --locked
      - name: Verify bundled speech model on real audio
        run: cargo test --locked --bin bibiparrot whisper_rs_segments_real_mp3 -- --ignored
      - name: Build
        run: cargo build --release --locked
      - name: Package native release with Rust
        run: cargo run --release --locked --bin package-release -- ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Verify all 13 packages and create checksums
        run: cargo run --release --locked --manifest-path tools/release-check/Cargo.toml -- dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "BibiParrot ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
